<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minecraft Multiplayer</title>
<link rel="shortcut icon" type="image/ico" href="https://www.minecraft.net/etc.clientlibs/minecraft/clientlibs/main/resources/favicon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');
body { overflow: hidden; margin: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
.world-select {
  width: 99vw; min-width: 300px; height: calc(100vh - 220px);
  position: absolute; bottom: 120px; overflow-y: auto;
  background-color: rgba(0,0,0,0.6); justify-content: center; margin: 0 auto;
}
.world {
  width: 250px; height: auto; border: 1px solid black;
  font-size: 18px; font-family: "Poppins", sans-serif; color: rgb(180,180,180);
  margin: 0 auto; margin-top: 15px; padding: 5px; cursor: pointer;
}
strong { color: white; }
.selected { border: 3px solid white; padding: 3px; }
input[type=text] {
  background-color: black; caret-color: white; border: 2px solid gray;
  color: white; font-size: 24px; padding-left: 12px;
}
input[type=text]:focus { border: 2px solid lightgray; }
#boxcentertop {
  z-index: 1; width: 80vw; max-width: 400px; height: 50px;
  position: relative; top: 30px; display: block; margin: 0 auto;
}
.hidden { display: none !important; }
#onhover {
  background-color: rgba(0,0,0,0.9); color: rgb(200,200,200);
  font-family: 'Poppins', sans-serif; word-wrap: normal; width: auto;
  max-width: 400px; position: absolute; z-index: 1; padding: 10px; cursor: default;
}
#quota {
  display: block; position: absolute; width: 99vw; margin: 0 auto;
  bottom: 110px; z-index: 1; background-color: rgba(0,0,0,0.6);
  justify-content: center; text-align: center; color: white;
  font-family: 'Poppins', sans-serif;
}

/* ===== Multiplayer + Mobile Patches ===== */
#mpMenu {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: linear-gradient(160deg,#1a1a1a,#2a2a2a); color: #fff;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  font-family: 'Poppins', sans-serif;
}
#mpMenu h1 { font-size: 28px; letter-spacing: 1px; margin: 0; }
#mpMenu input {
  padding: 12px 16px; border-radius: 8px; border: 2px solid #555;
  background: #111; color: #fff; font-size: 18px; text-align: center; width: 260px;
  caret-color: #fff;
}
#mpMenu input:focus { border-color: #3b8bff; outline: none; }
#mpMenu button {
  padding: 14px 40px; border: 0; border-radius: 8px;
  background: #3b8bff; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
  font-family: inherit;
}
#mpMenu button:disabled { background: #444; cursor: not-allowed; }
#mpMenu .hint { color: #888; font-size: 13px; max-width: 340px; text-align: center; line-height: 1.5; margin: 0; }

#mpStatus {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 30; padding: 6px 12px; border-radius: 6px;
  background: rgba(0,0,0,.6); color: #fff; font-size: 12px;
  font-family: sans-serif; pointer-events: none;
}
#mpStatus.ok { background: rgba(40,150,60,.85); }
#mpStatus.bad { background: rgba(180,40,40,.85); }

#touchUI { position: fixed; inset: 0; z-index: 25; pointer-events: none; display: none; }
#touchUI * { pointer-events: auto; }
#joystick {
  position: absolute; left: 24px; bottom: 100px; width: 140px; height: 140px;
  border-radius: 50%; background: rgba(255,255,255,.12);
  border: 2px solid rgba(255,255,255,.3);
}
#joystickKnob {
  position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
  margin: -30px 0 0 -30px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(180,200,255,.7));
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.tbtn {
  position: absolute; width: 78px; height: 78px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.55); color: #fff;
  font-size: 12px; font-weight: 800; background: rgba(0,0,0,.45);
  box-shadow: 0 4px 12px rgba(0,0,0,.35); font-family: sans-serif;
  letter-spacing: .5px;
}
.tbtn:active { transform: scale(.92); }
#btnJump  { left: 178px; bottom: 118px; background: rgba(50,140,60,.55); }
#btnBreak { right: 108px; bottom: 60px; background: rgba(190,60,60,.55); }
#btnPlace { right: 22px;  bottom: 100px; background: rgba(50,110,200,.55); }
#btnFly   { right: 108px; bottom: 158px; background: rgba(160,120,200,.55); }
#lookZone { position: absolute; inset: 0; z-index: -1; }
#mpOverlay { position: fixed; inset: 0; z-index: 15; pointer-events: none; }

@media (max-width: 600px) {
  #mpMenu input { width: 220px; font-size: 16px; }
}
</style>
</head>
<body>

<canvas id="overlay" tabindex="0" width="600" height="600" style="position: absolute; top: 0px; left: 0px"></canvas>

<!-- ===== Multiplayer UI (Patch 2) ===== -->
<div id="mpMenu">
  <h1>Minecraft Multiplayer</h1>
  <input id="mpName" type="text" maxlength="14" placeholder="Dein Name" spellcheck="false">
  <input id="mpRoom" type="text" maxlength="20" placeholder="Raum-Code (z.B. liebe123)" spellcheck="false">
  <button id="mpJoin">Spielen</button>
  <button id="mpSolo" style="background:#666;">Einzelspieler</button>
  <p class="hint">Beide Spieler geben den <b>gleichen Raum-Code</b> ein — dann seht ihr euch und baut zusammen.</p>
</div>
<div id="mpStatus" class="hidden">Verbinde…</div>

<div id="touchUI">
  <div id="joystick"><div id="joystickKnob"></div></div>
  <button class="tbtn" id="btnJump">SPRUNG</button>
  <button class="tbtn" id="btnBreak">ABBAU</button>
  <button class="tbtn" id="btnPlace">SETZEN</button>
  <button class="tbtn" id="btnFly">FLIEGEN</button>
  <div id="lookZone"></div>
</div>
<canvas id="mpOverlay"></canvas>

<input type="text" id="savebox" class="hidden" spellcheck="false" style="position: absolute; top: 10px; left: 10px; z-index: 1;">
<input type="text" id="boxcentertop" class="hidden" spellcheck="false">
<div id="quota" class="hidden"></div>
<div id="onhover" class="hidden"></div>
<p id="savedirections" class="hidden" style="position: absolute; top: 40px; left: 10px; z-index: 1; background-color: rgba(255,255,255,0.3);">
  JSCRAFT!
</p>
<div class="world-select hidden" id="worlds"></div>
<p id="message" class="hidden" style="position: absolute; top: 10px; right: 10px; z-index: 1; text-align: right; background-color: rgba(255,255,255,0.3);"></p>

<!-- ===== URL-Parameter (Patch 3) ===== -->
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const room = params.get('room') || localStorage.getItem('jscraft_room') || '';
  if (room) window.MP_ROOM = room;
  const name = params.get('name') || localStorage.getItem('jscraft_name') || '';
  if (name) window.MP_NAME = name;
})();
</script>

<script type="x-shader/vertex" id="blockVertexShader">
attribute vec3  aVertex;
attribute vec2  aTexture;
attribute float aShadow;
varying vec2  vTexture;
varying float vShadow;
varying float vFog;
uniform mat4 uView;
uniform float uDist;
uniform vec3 uPos;

void main(void) {
  vTexture = aTexture;
  vShadow = aShadow > 0.0 ? aShadow : 1.0;
  gl_Position = uView * vec4( aVertex, 1.0);
  float range = max(uDist / 5.0, 8.0);
  vFog = clamp((length(uPos.xz - aVertex.xz) - uDist + range) / range, 0.0, 1.0);
}
</script>
<script type="x-shader/fragment" id="blockFragmentShader">
#ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
#else
  precision mediump float;
#endif
uniform sampler2D uSampler;
varying float vShadow;
varying vec2 vTexture;
varying float vFog;
vec4 fog(vec4 color) {
  color.r += (0.33 - color.r) * vFog;
  color.g += (0.54 - color.g) * vFog;
  color.b += (0.72 - color.b) * vFog;
  return color;
}
void main(void){
  vec4 color = texture2D(uSampler, vTexture);
  gl_FragColor = fog(vec4(color.rgb * vShadow, color.a));
  if (gl_FragColor.a == 0.0) discard;
}
</script>
<script type="x-shader/vertex" id="2dVertexShader">
attribute vec2 aVertex;
attribute vec2 aTexture;
attribute float aShadow;
varying vec2 vTexture;
varying float vShadow;
void main(void) {
  vTexture = aTexture;
  vShadow = aShadow;
  gl_Position = vec4(aVertex, 0.5, 1.0);
}
</script>
<script type="x-shader/fragment" id="2dFragmentShader">
#ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
#else
  precision mediump float;
#endif
uniform sampler2D uSampler;
varying vec2 vTexture;
varying float vShadow;
void main(void) {
  vec4 color = texture2D(uSampler, vTexture);
  gl_FragColor = vec4(color.rgb * vShadow, color.a);
  if (gl_FragColor.a == 0.0) discard;
}
</script>
